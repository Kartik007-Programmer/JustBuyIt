<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details — JustBuyIt</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/Icons/Favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/users/pages/product.css">
    <link rel="stylesheet" href="/css/users/common.css">
</head>

<body>

<!-- ============ LOGIN PROMPT MODAL ============ -->
<div class="auth-modal-backdrop" id="authModal" aria-hidden="true">
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <button class="auth-modal-close" onclick="closeAuthModal()" aria-label="Close">×</button>

        <div class="auth-modal-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2Zm10-10V7a4 4 0 0 0-8 0v4h8Z"
                      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h2 id="authModalTitle">Sign in to continue</h2>
        <p class="auth-modal-msg">
            You need an account to add items to your cart and check out.
        </p>

        <div class="auth-modal-actions">
            <a href="/LoginForm.html" class="auth-btn auth-btn-primary">Log in</a>
            <a href="/RegistrationForm.html" class="auth-btn auth-btn-secondary">Create account</a>
        </div>

        <button class="auth-modal-later" onclick="closeAuthModal()">
            Continue browsing
        </button>
    </div>
</div>

<!-- ============ HEADER ============ -->
<header>
    <nav class="navbar">
        <div class="navbar-brand">Just<span>Buy</span>It</div>

        <div class="nav-links">
            <a href="/LoginForm.html"        class="nav-link guest-only">Login</a>
            <a href="/RegistrationForm.html" class="nav-link guest-only">Register</a>

            <a href="/Users_Pages/ShoppingCart.html"
               class="nav-link cart-link"
               id="cartNavLink"
               aria-label="Cart">
                <span class="cart-icon-wrap">
                    <svg class="cart-icon" viewBox="0 0 24 24" fill="none"
                         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3 3h2.2l2.1 12.4a2 2 0 0 0 1.97 1.6h9.36a2 2 0 0 0 1.96-1.55L22 8H6.2"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9"  cy="20" r="1.6" fill="currentColor"/>
                        <circle cx="18" cy="20" r="1.6" fill="currentColor"/>
                    </svg>
                    <span class="cart-badge" id="cartBadge" data-empty="true">0</span>
                </span>
                <span class="cart-text">Cart</span>
            </a>
        </div>

        <div class="user-menu auth-only" id="userMenu" hidden>
            <button class="user-pill" id="userPill"
                    aria-haspopup="true" aria-expanded="false"
                    aria-controls="userDropdown">
                <span class="user-avatar" id="userAvatar">U</span>
                <span class="user-name"   id="userName">User</span>
                <svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                    <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2"
                          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <div class="user-dropdown" id="userDropdown" role="menu">
                <a href="/Users_Pages/Profile.html" role="menuitem">My Profile</a>
                <a href="/Users_Pages/Orders.html"  role="menuitem">My Orders</a>
                <hr>
                <button class="danger" onclick="logout()" role="menuitem">Logout</button>
            </div>
        </div>
    </nav>
</header>

<div class="page-top">
    <a href="/HomePage.html" class="back">← Back to products</a>
</div>

<main id="mainContent">
    <div class="state-message"><h3>Loading product…</h3></div>
</main>

<script src="/js/users/navbar.js"></script>
<script>
    /* ============================================================
       PAGE STATE
       ============================================================ */
    const API_BASE = window.API_BASE;
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    let currentProduct = null;

    /* ============================================================
       HELPERS
       ============================================================ */
    function getCategoryName(p) {
        return p.category?.name || p.categoryName || null;
    }
    function getUnit(p) {
        return p.quantityUnit || p.qunatityUnit || null;
    }

    /* ============================================================
       RENDER PRODUCT
       ============================================================ */
    function renderProduct(p) {
        currentProduct = p;
        const imgSrc = p.imagefile
            ? `${API_BASE}/products/${p.id}/image`
            : "https://placehold.co/500?text=No+Image";

        const categoryName = getCategoryName(p);
        const unit = getUnit(p);
        const unitLabel = unit ? ` ${unit}` : "";
        const inStock = (p.quantity ?? 0) > 0;
        const lowStock = inStock && p.quantity <= 5;

        document.getElementById("mainContent").innerHTML = `
            <div class="detail-card">
                <div class="image-side">
                    <img src="${imgSrc}" alt="${p.name}">
                    ${categoryName ? `<span class="category-tag">${categoryName}</span>` : ""}
                </div>
                <div class="info-side">
                    <h1>${p.name}</h1>
                    <p class="desc">${p.description || "No description available for this product."}</p>

                    <div class="price-row">
                        <span class="price">₹${p.price}</span>
                        ${unit ? `<span class="unit-note">per ${unit}</span>` : ""}
                    </div>

                    <p class="stock-line ${lowStock ? "low" : ""}">
                        ${inStock
                            ? `<b>${p.quantity}${unitLabel}</b> in stock${lowStock ? " — order soon" : ""}`
                            : `<b>Out of stock</b>`}
                    </p>

                    <div class="qty-row">
                        <div class="qty-control">
                            <button type="button" onclick="changeQty(-1)">−</button>
                            <input type="number" id="qtyInput" value="1" min="1" max="${p.quantity ?? 1}">
                            <button type="button" onclick="changeQty(1)">+</button>
                        </div>
                    </div>

                    <div class="action-row">
                        <button class="btn-primary" id="buyBtn" onclick="buyProduct(event)" ${inStock ? "" : "disabled"}>Buy now</button>
                        <button class="btn-secondary" id="cartBtn" onclick="addToCart(event)" ${inStock ? "" : "disabled"}>Add to cart</button>
                    </div>

                    <div class="feedback" id="feedback"></div>
                </div>
            </div>
        `;
    }

    /* ============================================================
       LOAD PRODUCT
       ============================================================ */
    function loadProduct() {
        if (!id) {
            document.getElementById("mainContent").innerHTML = `
                <div class="state-message"><h3>No product selected</h3><p>Go back and pick a product to view.</p></div>
            `;
            return;
        }

        fetch(`${API_BASE}/products/${id}`)
            .then(res => {
                if (!res.ok) throw new Error("Product not found");
                return res.json();
            })
            .then(p => renderProduct(p))
            .catch(err => {
                console.error("Failed to load product:", err);
                document.getElementById("mainContent").innerHTML = `
                    <div class="state-message"><h3>Couldn't load this product</h3><p>It may have been removed, or the connection failed.</p></div>
                `;
            });
    }

    /* ============================================================
       QTY CONTROLS
       ============================================================ */
    function changeQty(delta) {
        const input = document.getElementById("qtyInput");
        const max = currentProduct?.quantity ?? 1;
        let value = parseInt(input.value || "1", 10) + delta;
        value = Math.max(1, Math.min(value, max));
        input.value = value;
    }

    function getQty() {
        const input = document.getElementById("qtyInput");
        return input ? Math.max(1, parseInt(input.value || "1", 10)) : 1;
    }

    function showFeedback(message, type) {
        const el = document.getElementById("feedback");
        if (!el) return;
        el.innerText = message;
        el.className = `feedback ${type}`;
    }

    /* ============================================================
       ADD TO CART
       ============================================================ */
    function addToCart(event) {
        const btn = document.getElementById("cartBtn");
        if (!btn || btn.classList.contains("loading") || btn.classList.contains("added")) return;

        if (event) window.spawnRipple(btn, event);
        btn.classList.add("loading");

        const qty = getQty();
        fetch(`${API_BASE}/users/cart/items`, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ productId: currentProduct.id, quantity: qty })
        })
            .then(res => {
                if (window.isUnauthorized(res)) {
                    const e = new Error("UNAUTHORIZED");
                    e.code = "UNAUTHORIZED";
                    throw e;
                }
                if (!res.ok) throw new Error("Add to cart failed");
                return res.json();
            })
            .then(() => {
                btn.classList.remove("loading");
                btn.classList.add("added");
                const original = btn.innerText;
                btn.innerText = "✓ Added to cart";
                showFeedback("Added to cart.", "success");
                window.refreshCartBadge(true);
                setTimeout(() => {
                    btn.classList.remove("added");
                    btn.innerText = original || "Add to cart";
                }, 1400);
            })
            .catch(err => {
                console.error("Add to cart error:", err);
                btn.classList.remove("loading");

                if (err.code === "UNAUTHORIZED") {
                    btn.innerText = "Add to cart";
                    window.openAuthModal();
                    return;
                }

                btn.innerText = "Try again";
                showFeedback("Couldn't add to cart. Try again.", "error");
                setTimeout(() => { btn.innerText = "Add to cart"; }, 1200);
            });
    }

    /* ============================================================
       BUY NOW
       ============================================================ */
    function buyProduct(event) {
        const btn = document.getElementById("buyBtn");
        if (!btn || btn.classList.contains("loading")) return;

        if (event) window.spawnRipple(btn, event);
        btn.classList.add("loading");

        const qty = getQty();
        fetch(`${API_BASE}/users/cart/items`, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ productId: currentProduct.id, quantity: qty })
        })
            .then(res => {
                if (window.isUnauthorized(res)) {
                    const e = new Error("UNAUTHORIZED");
                    e.code = "UNAUTHORIZED";
                    throw e;
                }
                if (!res.ok) throw new Error("Couldn't add to cart");
                return res.json();
            })
            .then(() => {
                window.refreshCartBadge(true);
                setTimeout(() => {
                    window.location.href = "/Users_Pages/PaymentCheckout.html";
                }, 350);
            })
            .catch(err => {
                console.error("Buy now error:", err);
                btn.classList.remove("loading");

                if (err.code === "UNAUTHORIZED") {
                    window.openAuthModal();
                    return;
                }
                showFeedback("Couldn't start checkout. Try again.", "error");
            });
    }

    /* ============================================================
       INIT — wait for navbar.js auth check, then load product
       ============================================================ */
    (async function initPage() {
        await window.__authReady;
        loadProduct();
        window.refreshCartBadge();
    })();
</script>
</body>
</html>
