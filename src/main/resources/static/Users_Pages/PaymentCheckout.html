<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — JustBuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/users/pages/checkout.css">
    <link rel="stylesheet" href="/css/users/common.css">
</head>

<body>

<!-- ============ LOGIN PROMPT MODAL ============ -->
<div class="auth-modal-backdrop" id="authModal" aria-hidden="true">
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <button class="auth-modal-close" onclick="closeAuthModal()" aria-label="Close">×</button>
        <div class="auth-modal-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2Zm10-10V7a4 4 0 0 0-8 0v4h8Z"
                      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h2>Sign in to continue</h2>
        <p class="auth-modal-msg">You need an account to check out.</p>
        <div class="auth-modal-actions">
            <a href="/LoginForm.html" class="auth-btn auth-btn-primary">Log in</a>
            <a href="/RegistrationForm.html" class="auth-btn auth-btn-secondary">Create account</a>
        </div>
        <button class="auth-modal-later" onclick="closeAuthModal()">Continue browsing</button>
    </div>
</div>

<!-- ============ HEADER ============ -->
<header>
    <nav class="navbar">
        <div class="navbar-brand">Just<span>Buy</span>It</div>

        <div class="nav-links">
            <a href="/LoginForm.html"        class="nav-link guest-only">Login</a>
            <a href="/RegistrationForm.html" class="nav-link guest-only">Register</a>

            <a href="/Users_Pages/ShoppingCart.html"
               class="nav-link cart-link" id="cartNavLink" aria-label="Cart">
                <span class="cart-icon-wrap">
                    <svg class="cart-icon" viewBox="0 0 24 24" fill="none"
                         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3 3h2.2l2.1 12.4a2 2 0 0 0 1.97 1.6h9.36a2 2 0 0 0 1.96-1.55L22 8H6.2"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9"  cy="20" r="1.6" fill="currentColor"/>
                        <circle cx="18" cy="20" r="1.6" fill="currentColor"/>
                    </svg>
                    <span class="cart-badge" id="cartBadge" data-empty="true">0</span>
                </span>
                <span class="cart-text">Cart</span>
            </a>
        </div>

        <div class="user-menu auth-only" id="userMenu" hidden>
            <button class="user-pill" id="userPill"
                    aria-haspopup="true" aria-expanded="false" aria-controls="userDropdown">
                <span class="user-avatar" id="userAvatar">U</span>
                <span class="user-name"   id="userName">User</span>
                <svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                    <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2"
                          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="user-dropdown" id="userDropdown" role="menu">
                <a href="/Users_Pages/Profile.html" role="menuitem">My Profile</a>
                <a href="/Users_Pages/Orders.html"  role="menuitem">My Orders</a>
                <hr>
                <button class="danger" onclick="logout()" role="menuitem">Logout</button>
            </div>
        </div>
    </nav>
</header>

<div class="page-top">
    <a href="/Users_Pages/ShoppingCart.html" class="back">← Back to cart</a>
</div>

<main id="mainContent">
    <div class="state-message"><h3>Loading checkout…</h3></div>
</main>

<script src="/js/users/navbar.js"></script>
<script>
    /* ============================================================
       PAGE STATE
       ============================================================ */
    const API_BASE  = window.API_BASE;
    const CART_BASE = `${API_BASE}/users/cart`;
    const PROFILE_BASE = `${API_BASE}/users/profile`;

    let currentCart       = null;
    let selectedMethod    = "UPI";
    let lastPaymentResponse = null;

    /* ============================================================
       LOAD CART → RENDER
       ============================================================ */
    function loadCheckout() {
        fetch(CART_BASE, { credentials: "include" })
            .then(res => {
                if (res.status === 401 || res.status === 403) throw new Error("Not authenticated");
                if (!res.ok) throw new Error("Failed to load cart");
                return res.json();
            })
            .then(cart => {
                currentCart = cart;
                if ((cart.items || []).length === 0) {
                    document.getElementById("mainContent").innerHTML = `
                        <div class="state-message">
                            <h3>Your cart is empty</h3>
                            <p>Add something to your cart before checking out.</p>
                            <a href="/HomePage.html" class="browse-link">Browse products →</a>
                        </div>`;
                    return;
                }
                renderCheckout(cart);
            })
            .catch(err => {
                console.error("Checkout load error:", err);
                document.getElementById("mainContent").innerHTML = `
                    <div class="state-message">
                        <h3>Couldn't load checkout</h3>
                        <p>Make sure you're signed in, then try again.</p>
                        <a href="/Users_Pages/ShoppingCart.html" class="browse-link">Back to cart →</a>
                    </div>`;
            });
    }

    /* ============================================================
       RENDER CHECKOUT
       ============================================================ */
    function renderCheckout(cart) {
        const items = cart.items || [];
        const lines = items.map(i => `
            <div class="summary-line">
                <span class="name">${i.productName}</span>
                <span class="qty">×${i.quantity}</span>
                <span>₹${i.subTotal}</span>
            </div>
        `).join("");

        document.getElementById("mainContent").innerHTML = `
            <h1 class="page-title">Checkout</h1>
            <p class="page-sub">Confirm your delivery details and choose how you'd like to pay.</p>

            <div class="checkout-layout">
                <div class="checkout-left">

                    <!-- ============ DELIVERY DETAILS ============ -->
                    <div class="panel">
                        <h2>Delivery details</h2>

                        <div class="field">
                            <label for="deliveryName">Recipient name</label>
                            <input type="text" id="deliveryName" placeholder="Full name" autocomplete="name">
                            <div class="field-error" id="err-deliveryName">Please enter the recipient's name.</div>
                        </div>

                        <div class="field">
                            <label for="deliveryPhone">Phone</label>
                            <input type="tel" id="deliveryPhone" placeholder="+91 98765 43210" autocomplete="tel">
                            <div class="field-error" id="err-deliveryPhone">Please enter a valid phone number.</div>
                        </div>

                        <div class="field">
                            <label for="deliveryAddress">Delivery address</label>
                            <textarea id="deliveryAddress" rows="3"
                                      placeholder="Street, City, State, PIN"
                                      autocomplete="street-address"></textarea>
                            <div class="field-error" id="err-deliveryAddress">Please enter a delivery address.</div>
                        </div>
                    </div>

                    <!-- ============ PAYMENT METHOD ============ -->
                    <div class="panel">
                        <div class="demo-banner">
                            Demo mode — this is a simulated payment. Don't enter real card or UPI details.
                        </div>

                        <h2>Payment method</h2>
                        <div class="method-row">
                            <button type="button" class="method-option active" id="opt-UPI" onclick="selectMethod('UPI')">
                                <div class="m-title">UPI</div>
                                <div class="m-sub">Pay via UPI ID</div>
                            </button>
                            <button type="button" class="method-option" id="opt-CARD" onclick="selectMethod('CARD')">
                                <div class="m-title">Card</div>
                                <div class="m-sub">Credit or debit</div>
                            </button>
                            <button type="button" class="method-option" id="opt-COD" onclick="selectMethod('COD')">
                                <div class="m-title">Cash on delivery</div>
                                <div class="m-sub">Pay when it arrives</div>
                            </button>
                        </div>

                        <!-- UPI fields -->
                        <div id="upiFields">
                            <div class="field">
                                <label for="upiId">UPI ID</label>
                                <input type="text" id="upiId" placeholder="yourname@bank" autocomplete="off">
                                <div class="field-error" id="err-upiId">Enter a valid UPI ID (e.g. name@bank).</div>
                            </div>
                        </div>

                        <!-- Card fields -->
                        <div id="cardFields" class="hidden">
                            <div class="field">
                                <label for="cardHolderName">Name on card</label>
                                <input type="text" id="cardHolderName" placeholder="As printed on the card" autocomplete="off">
                                <div class="field-error" id="err-cardHolderName">Enter the cardholder's name.</div>
                            </div>
                            <div class="field">
                                <label for="cardNumber">Card number</label>
                                <input type="text" id="cardNumber" placeholder="4111 1111 1111 1111"
                                       inputmode="numeric" maxlength="19" autocomplete="off"
                                       oninput="formatCardNumber(this)">
                                <div class="field-error" id="err-cardNumber">Enter a 16-digit card number.</div>
                            </div>
                            <div class="field-row">
                                <div class="field">
                                    <label for="cardExpiryDate">Expiry</label>
                                    <input type="text" id="cardExpiryDate" placeholder="MM/YY" maxlength="5"
                                           inputmode="numeric" autocomplete="off" oninput="formatExpiry(this)">
                                    <div class="field-error" id="err-cardExpiryDate">Use MM/YY, and not in the past.</div>
                                </div>
                                <div class="field">
                                    <label for="cardCvv">CVV</label>
                                    <input type="password" id="cardCvv" placeholder="123" maxlength="4"
                                           inputmode="numeric" autocomplete="off" oninput="digitsOnly(this)">
                                    <div class="field-error" id="err-cardCvv">Enter the 3- or 4-digit CVV.</div>
                                </div>
                            </div>
                        </div>

                        <!-- COD note -->
                        <div id="codFields" class="hidden">
                            <p class="cod-note">
                                No payment details needed. You'll pay the full amount when your order is delivered.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- ============ ORDER SUMMARY ============ -->
                <div class="panel summary-card">
                    <h2>Order summary</h2>
                    ${lines}
                    <div class="summary-total">
                        <span>Total</span>
                        <span class="amount">₹${cart.totalPrice}</span>
                    </div>
                    <button class="btn-pay" id="payBtn" onclick="submitPayment()">
                        Pay ₹${cart.totalPrice}
                    </button>
                    <div class="secure-note">Simulated transaction · no real money moves</div>
                    <div class="feedback" id="feedback"></div>
                </div>
            </div>
        `;

        // Prefill delivery fields from cached user, then refresh from server
        prefillDelivery(window.currentUser || {});
        refreshProfile();
    }

    /* ============================================================
       PREFILL DELIVERY FROM USER OBJECT
       ============================================================ */
    function prefillDelivery(user) {
        const nameEl  = document.getElementById("deliveryName");
        const phoneEl = document.getElementById("deliveryPhone");
        const addrEl  = document.getElementById("deliveryAddress");

        if (nameEl  && !nameEl.value)  nameEl.value  = user.name    || "";
        if (phoneEl && !phoneEl.value) phoneEl.value = user.phone   || "";
        if (addrEl  && !addrEl.value)  addrEl.value  = user.address || "";
    }

    async function refreshProfile() {
        try {
            const res = await fetch(PROFILE_BASE, {
                credentials: "include",
                headers: { "Accept": "application/json" }
            });
            if (!res.ok) return;
            const profile = await res.json();
            window.currentUser = Object.assign({}, window.currentUser, profile);
            prefillDelivery(profile);
        } catch (_) { /* ignore — cached values are fine */ }
    }

    /* ============================================================
       PAYMENT METHOD SWITCHING
       ============================================================ */
    function selectMethod(method) {
        selectedMethod = method;
        ["UPI", "CARD", "COD"].forEach(m => {
            document.getElementById(`opt-${m}`).classList.toggle("active", m === method);
        });
        document.getElementById("upiFields").classList.toggle("hidden", method !== "UPI");
        document.getElementById("cardFields").classList.toggle("hidden", method !== "CARD");
        document.getElementById("codFields").classList.toggle("hidden", method !== "COD");
        clearErrors();
    }

    /* ============================================================
       INPUT FORMATTING
       ============================================================ */
    function digitsOnly(el) {
        el.value = el.value.replace(/\D/g, "");
    }
    function formatCardNumber(el) {
        const digits = el.value.replace(/\D/g, "").slice(0, 16);
        el.value = digits.replace(/(.{4})/g, "$1 ").trim();
    }
    function formatExpiry(el) {
        let digits = el.value.replace(/\D/g, "").slice(0, 4);
        if (digits.length >= 3) {
            el.value = `${digits.slice(0, 2)}/${digits.slice(2)}`;
        } else {
            el.value = digits;
        }
    }

    /* ============================================================
       VALIDATION
       ============================================================ */
    function setError(fieldId, hasError) {
        const input = document.getElementById(fieldId);
        const error = document.getElementById(`err-${fieldId}`);
        if (input) input.classList.toggle("invalid", hasError);
        if (error) error.classList.toggle("show", hasError);
    }

    function clearErrors() {
        ["deliveryName", "deliveryPhone", "deliveryAddress",
         "upiId", "cardHolderName", "cardNumber", "cardExpiryDate", "cardCvv"]
            .forEach(id => setError(id, false));
        showFeedback("");
    }

    function expiryIsValid(value) {
        const match = /^(\d{2})\/(\d{2})$/.exec(value);
        if (!match) return false;
        const month = parseInt(match[1], 10);
        const year  = 2000 + parseInt(match[2], 10);
        if (month < 1 || month > 12) return false;
        const endOfMonth = new Date(year, month, 0, 23, 59, 59);
        return endOfMonth >= new Date();
    }

    function validate() {
        clearErrors();
        let valid = true;

        // ---- Delivery ----
        const dName  = (document.getElementById("deliveryName")?.value  || "").trim();
        const dPhone = (document.getElementById("deliveryPhone")?.value || "").trim();
        const dAddr  = (document.getElementById("deliveryAddress")?.value || "").trim();

        if (dName.length < 2) {
            setError("deliveryName", true);
            valid = false;
        }
        if (!/^[+\d][\d\s\-()]{7,}$/.test(dPhone)) {
            setError("deliveryPhone", true);
            valid = false;
        }
        if (dAddr.length < 5) {
            setError("deliveryAddress", true);
            valid = false;
        }

        // ---- Payment method ----
        if (selectedMethod === "UPI") {
            const upi = document.getElementById("upiId").value.trim();
            if (!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(upi)) {
                setError("upiId", true);
                valid = false;
            }
        }

        if (selectedMethod === "CARD") {
            const name   = document.getElementById("cardHolderName").value.trim();
            const number = document.getElementById("cardNumber").value.replace(/\s/g, "");
            const expiry = document.getElementById("cardExpiryDate").value.trim();
            const cvv    = document.getElementById("cardCvv").value.trim();

            if (name.length < 2)                  { setError("cardHolderName", true); valid = false; }
            if (number.length !== 16)             { setError("cardNumber", true);     valid = false; }
            if (!expiryIsValid(expiry))           { setError("cardExpiryDate", true); valid = false; }
            if (cvv.length < 3 || cvv.length > 4) { setError("cardCvv", true);        valid = false; }
        }

        return valid;
    }

    /* ============================================================
       BUILD REQUEST BODIES
       ============================================================ */
    function buildDeliveryRequest() {
        return {
            name:    document.getElementById("deliveryName").value.trim(),
            phone:   document.getElementById("deliveryPhone").value.trim(),
            address: document.getElementById("deliveryAddress").value.trim()
        };
    }

    function buildPaymentRequest() {
        const request = { paymentMethod: selectedMethod };

        if (selectedMethod === "UPI") {
            request.upiId = document.getElementById("upiId").value.trim();
        } else if (selectedMethod === "CARD") {
            request.cardHolderName = document.getElementById("cardHolderName").value.trim();
            request.cardNumber     = document.getElementById("cardNumber").value.replace(/\s/g, "");
            request.cardExpiryDate = document.getElementById("cardExpiryDate").value.trim();
            request.cardCvv        = document.getElementById("cardCvv").value.trim();
        }

        return request;
    }

    /* ============================================================
       SUBMIT — 2 steps: save delivery → pay
       ============================================================ */
    async function submitPayment() {
        if (!validate()) {
            showFeedback("Please fix the highlighted fields.");
            return;
        }

        const btn = document.getElementById("payBtn");
        btn.disabled = true;
        btn.innerText = "Saving delivery info…";
        showFeedback("");

        // --- Step 1: persist delivery to profile ---
        try {
            const profileRes = await fetch(PROFILE_BASE, {
                method: "PUT",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(buildDeliveryRequest())
            });
            if (!profileRes.ok) {
                let msg = "Couldn't save delivery details.";
                try {
                    const body = await profileRes.json();
                    msg = body.message || body.error || msg;
                } catch (_) {}
                throw new Error(msg);
            }
            // Refresh cached user so navbar/dropdown sees new info
            const updated = buildDeliveryRequest();
            window.currentUser = Object.assign({}, window.currentUser, updated);
        } catch (err) {
            console.error("Profile save error:", err);
            btn.disabled = false;
            btn.innerText = `Pay ₹${currentCart.totalPrice}`;
            showFeedback(err.message || "Couldn't save delivery details.");
            return;
        }

        // --- Step 2: process payment ---
        btn.innerText = "Processing…";
        try {
            const res = await fetch(`${CART_BASE}/payment/checkout`, {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(buildPaymentRequest())
            });

            if (res.status === 401 || res.status === 403)
                throw new Error("Your session expired. Please log in again.");

            if (!res.ok) {
                let msg = "Payment failed";
                try {
                    const body = await res.json();
                    msg = body.message || body.error || msg;
                } catch (_) {}
                throw new Error(msg);
            }

            const payment = await res.json();
            renderSuccess(payment);
            window.refreshCartBadge();

        } catch (err) {
            console.error("Payment error:", err);
            btn.disabled = false;
            btn.innerText = `Pay ₹${currentCart.totalPrice}`;
            showFeedback(err.message || "Payment couldn't be processed. Please try again.");
        }
    }

    /* ============================================================
       SUCCESS SCREEN
       ============================================================ */
    function renderSuccess(payment) {
        lastPaymentResponse = payment;
        const currency = payment.currency || "INR";

        document.getElementById("mainContent").innerHTML = `
            <div class="success-wrap">
                <div class="success-badge">✓</div>
                <h2>Payment successful</h2>
                <p class="msg">${payment.message || "Your order has been placed."}</p>

                <div class="receipt">
                    <div class="receipt-row">
                        <span>Transaction ID</span>
                        <span>${payment.transactionId || "—"}</span>
                    </div>
                    <div class="receipt-row">
                        <span>Amount paid</span>
                        <span>₹${payment.amount} ${currency}</span>
                    </div>
                    <div class="receipt-row">
                        <span>Payment method</span>
                        <span>${payment.paymentMethod}</span>
                    </div>
                    <div class="receipt-row">
                        <span>Status</span>
                        <span class="status-ok">${payment.status || "SUCCESS"}</span>
                    </div>
                </div>

                <div class="success-actions">
                    <a href="/Users_Pages/Orders.html" class="btn-solid">View my orders</a>
                    <a href="/HomePage.html" class="btn-outline">Continue shopping</a>
                    <button class="btn-outline" id="downloadBtn" onclick="downloadPdfReceipt()">
                        Download Receipt (PDF)
                    </button>
                </div>
                <div class="feedback" id="receiptFeedback"></div>
            </div>
        `;
    }

    /* ============================================================
       RECEIPT DOWNLOAD
       ============================================================ */
    function downloadPdfReceipt() {
        const currentPaymentResponse = lastPaymentResponse;
        if (!currentPaymentResponse) return;

        const btn = document.getElementById("downloadBtn");
        if (btn) btn.innerText = "Generating PDF…";

        fetch(`${CART_BASE}/payment/checkout/receipt`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(currentPaymentResponse)
        })
            .then(res => {
                if (!res.ok) {
                    return res.text().then(body => {
                        throw new Error(`Receipt failed: ${res.status} — ${body}`);
                    });
                }
                return res.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `receipt-${currentPaymentResponse.paymentMethod || "order"}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
                if (btn) btn.innerText = "Download Receipt (PDF)";
            })
            .catch(err => {
                console.error("Receipt download error:", err);
                if (btn) btn.innerText = "Download Receipt (PDF)";
                const feedback = document.getElementById("receiptFeedback");
                if (feedback) {
                    feedback.innerText = "Could not download receipt. Please try again.";
                    feedback.className = "feedback error";
                }
            });
    }

    /* ============================================================
       FEEDBACK
       ============================================================ */
    function showFeedback(message) {
        const el = document.getElementById("feedback");
        if (el) {
            el.innerText = message;
            el.className = message ? "feedback error" : "feedback";
        }
    }

    /* ============================================================
       INIT
       ============================================================ */
    (async function initPage() {
        const user = await window.__authReady;
        if (!user) {
            const here = encodeURIComponent(location.pathname + location.search);
            window.location.href = `/LoginForm.html?redirect=${here}`;
            return;
        }
        loadCheckout();
    })();
</script>
</body>
</html>
