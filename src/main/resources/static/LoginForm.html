<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — JustBuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/users/common.css">
    <link rel="stylesheet" href="/css/users/pages/auth.css">
</head>
<body class="auth-page">

<a href="/" class="auth-brand">Just<span>Buy</span>It</a>

<div class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to pick up where you left off.</p>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Email address</label>
            <input type="email" id="username" required placeholder="user@example.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="forgot-link-row">
            <a href="/ForgotPassword.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
    </form>

    <div class="auth-footer-text">
        Don't have an account? <a href="/RegistrationForm.html">Create one</a>
    </div>
</div>

<a href="/HomePage.html" class="auth-home-link">← Continue browsing</a>

<!-- Popup alert markup -->
<div id="globalPopup" class="popup-alert" role="alert" aria-live="polite">
    <div class="popup-icon" id="popupIcon">✓</div>
    <div class="popup-message" id="popupMessage"></div>
    <button class="popup-close" id="popupCloseBtn" aria-label="Close notification">×</button>
    <div class="popup-progress" id="popupProgress"></div>
</div>

<script src="/js/popup.js"></script>
<script>
    // Verified banner via popup
    (function showVerifiedBanner() {
        const v = new URLSearchParams(location.search).get('verified');
        if (!v) return;
        if (v === 'success') {
            showPopup('Email verified! You can now sign in.', 'success', 5000);
        } else {
            showPopup('Verification link is invalid or has expired.', 'error', 5000);
        }
    })();

    // Redirect target
    function getRedirectTarget() {
        const raw = new URLSearchParams(location.search).get("redirect");
        if (!raw) return null;
        if (!raw.startsWith("/") || raw.startsWith("//") || raw.includes("\\")) return null;
        if (raw.startsWith("/LoginForm.html")) return null;
        return raw;
    }
    const REDIRECT_TARGET = getRedirectTarget();

    (function forwardRedirectToRegisterLink() {
        if (!REDIRECT_TARGET) return;
        const regLink = document.querySelector('.auth-footer-text a[href="/RegistrationForm.html"]');
        if (regLink) {
            regLink.href = `/RegistrationForm.html?redirect=${encodeURIComponent(REDIRECT_TARGET)}`;
        }
    })();

    // Submit
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const params = new URLSearchParams();
        params.append('username', document.getElementById('username').value);
        params.append('password', document.getElementById('password').value);

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in…';

        try {
            const response = await fetch('/auth/v1/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });

            if (response.ok) {
                const message = await response.text();
                showPopup(message || 'Login successful!', 'success', 2500);
                const destination = REDIRECT_TARGET || "/";
                setTimeout(() => window.location.href = destination, 1000);
            } else {
                const text = await response.text().catch(() => '');
                showPopup(text || 'Invalid email or password.', 'error', 5000);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        } catch (error) {
            showPopup('Unable to connect to the server.', 'error', 5000);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign in';
        }
    });

    window.addEventListener("pageshow", e => { if (e.persisted) window.location.reload(); });
</script>

</body>
</html>
