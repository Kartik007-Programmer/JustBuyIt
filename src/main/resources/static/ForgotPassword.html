<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — JustBuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/users/common.css">
    <link rel="stylesheet" href="/css/users/pages/auth.css">
</head>
<body class="auth-page">

<a href="/" class="auth-brand">Just<span>Buy</span>It</a>

<div class="auth-card">
    <h2>Forgot your password?</h2>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <form id="forgotForm">
        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" required placeholder="user@example.com" autocomplete="email">
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
    </form>

    <div class="auth-footer-text">
        Remembered it? <a href="/LoginForm.html">Back to sign in</a>
    </div>
</div>

<a href="/HomePage.html" class="auth-home-link">← Continue browsing</a>

<div id="globalPopup" class="popup-alert" role="alert" aria-live="polite">
    <div class="popup-icon" id="popupIcon">✓</div>
    <div class="popup-message" id="popupMessage"></div>
    <button class="popup-close" id="popupCloseBtn" aria-label="Close notification">×</button>
    <div class="popup-progress" id="popupProgress"></div>
</div>

<script src="/js/popup.js"></script>
<script>
    document.getElementById('forgotForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const params = new URLSearchParams();
        params.append('email', document.getElementById('email').value);

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending…';

        try {
            const res = await fetch('/auth/v1/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
            const msg = await res.text();
            showPopup(
                msg || (res.ok ? 'Check your inbox.' : 'Something went wrong.'),
                res.ok ? 'success' : 'error',
                5000
            );
        } catch (err) {
            showPopup('Unable to connect to the server.', 'error', 5000);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send reset link';
        }
    });
</script>

</body>
</html>
