<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#CCCCFF">
    <title>JustBuyIt — Product Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/users/pages/home.css">
    <link rel="stylesheet" href="/css/users/common.css">
</head>

<!-- ============ LOGIN PROMPT MODAL ============ -->
<div class="auth-modal-backdrop" id="authModal" aria-hidden="true">
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <button class="auth-modal-close" onclick="closeAuthModal()" aria-label="Close">×</button>

        <div class="auth-modal-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2Zm10-10V7a4 4 0 0 0-8 0v4h8Z"
                      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h2 id="authModalTitle">Sign in to continue</h2>
        <p class="auth-modal-msg">
            You need an account to add items to your cart and check out.
        </p>

        <div class="auth-modal-actions">
            <a href="/LoginForm.html" class="auth-btn auth-btn-primary">Log in</a>
            <a href="/RegistrationForm.html" class="auth-btn auth-btn-secondary">Create account</a>
        </div>

        <button class="auth-modal-later" onclick="closeAuthModal()">
            Continue browsing
        </button>
    </div>
</div>

<body>

<header>
    <nav class="navbar">
        <div class="navbar-brand">Just<span>Buy</span>It</div>
        <div class="nav-links">
            <a href="/LoginForm.html" class="nav-link">Login</a>
            <a href="/RegistrationForm.html" class="nav-link">Register</a>
            <a href="/users/ShoppingCart.html" class="nav-link cart-link" aria-label="Cart" id="cartNavLink">
                <span class="cart-icon-wrap">
                    <svg class="cart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3 3h2.2l2.1 12.4a2 2 0 0 0 1.97 1.6h9.36a2 2 0 0 0 1.96-1.55L22 8H6.2"
                              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9" cy="20" r="1.6" fill="currentColor"/>
                        <circle cx="18" cy="20" r="1.6" fill="currentColor"/>
                    </svg>
                    <span class="cart-badge" id="cartBadge" data-empty="true">0</span>
                </span>
                            <span class="cart-text">Cart</span>
            </a>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>
</header>

<div class="hero">
    <h1>Everything on your list, in one place.</h1>
    <p class="sub">Browse fresh stock across every category and check out in a couple of clicks.</p>
    <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search products by name..." onkeyup="filterProducts()">
    </div>
    <div class="category-wrapper">
        <button class="scroll-btn left" onclick="scrollCats(-1)">‹</button>
        <div class="category-row" id="categoryRow"></div>
        <button class="scroll-btn right" onclick="scrollCats(1)">›</button>
    </div>
</div>

<main>
    <div class="grid" id="productList"></div>
    <div class="pagination" id="pagination"></div>
</main>

<footer>
    © <span id="year"></span> JustBuyIt. All prices shown in INR.
</footer>

<script>
    // ---------- Config ----------
    const API_BASE = "http://localhost:8080";
    const PAGE_SIZE = 15;
    const DRAG_THRESHOLD = 6;

    // ---------- State ----------
    let activeCategory = "All";
    let currentPage = 0;
    let totalPages = 0;
    let currentSearchTerm = "";
    let availableCategories = [];
    let isGuestUser = null;

    // ---------- Init year ----------
    document.getElementById("year").innerText = new Date().getFullYear();

    // ---------- Helpers ----------
    function getCategoryName(p) {
        const c = p.category;
        if (!c) return p.categoryName || null;
        if (typeof c === "string") return c;
        return c.name || null;
    }

    function getUnit(p) {
        return p.quantityUnit || p.qunatityUnit || "";
    }

    // ---------- Skeleton: render N placeholder cards ----------
    function renderSkeletons(count = PAGE_SIZE) {
        const container = document.getElementById("productList");
        container.innerHTML = "";
        for (let i = 0; i < count; i++) {
            const skeleton = document.createElement("div");
            skeleton.className = "card skeleton-card";
            skeleton.innerHTML = `
                <div class="img-container skeleton-img"></div>
                <div class="content">
                    <div class="skeleton-line skeleton-title"></div>
                    <div class="skeleton-line skeleton-sub"></div>
                    <div class="price-row">
                        <div class="skeleton-line skeleton-price"></div>
                        <div class="skeleton-btn"></div>
                    </div>
                </div>
            `;
            container.appendChild(skeleton);
        }
    }

    // ---------- Products: fetch one page ----------
    function loadProducts(page = 0, searchTerm = "", category = activeCategory) {
        currentPage = page;
        currentSearchTerm = searchTerm;

        // Show skeletons immediately (but keep the row height stable)
        renderSkeletons(PAGE_SIZE);

        // Hide pagination while loading to avoid stale buttons
        document.getElementById("pagination").innerHTML = "";

        const params = new URLSearchParams({ page, size: PAGE_SIZE });
        if (category && category !== "All") params.set("category", category);

        const url = searchTerm
            ? `${API_BASE}/products/search?keyword=${encodeURIComponent(searchTerm)}&${params.toString()}`
            : `${API_BASE}/products?${params.toString()}`;

        fetch(url, { credentials: "include" })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                const content = data.content || data;
                displayProducts(content);
                if (data.totalPages !== undefined) {
                    renderPagination(data);
                }
            })
            .catch(err => {
                console.error("Failed to load products:", err);
                const container = document.getElementById("productList");
                container.innerHTML =
                    `<div class="state-message">
                        <h3>Couldn't load products</h3>
                        <p>${err.message}</p>
                     </div>`;
                document.getElementById("pagination").innerHTML = "";
            });
    }

    // ---------- Categories: render chips ----------
    function renderCategories() {
        const row = document.getElementById("categoryRow");
        row.innerHTML = "";

        availableCategories.forEach(cat => {
            const chip = document.createElement("button");
            chip.className = "chip" + (cat === activeCategory ? " active" : "");
            chip.innerText = cat;
            chip.dataset.category = cat;
            row.appendChild(chip);
        });

        setTimeout(updateArrows, 50);
        requestAnimationFrame(updateArrows);
    }

    // ---------- Products: render cards ----------
    function displayProducts(products) {
        const container = document.getElementById("productList");
        container.innerHTML = "";

        if (!products || products.length === 0) {
            container.innerHTML =
                `<div class="state-message">
                    <h3>No products found</h3>
                    <p>Try a different search term or category.</p>
                 </div>`;
            return;
        }

        products.forEach(p => {
            const card = document.createElement("div");
            card.className = "card";
            card.onclick = (e) => {
                if (!e.target.closest("button")) {
                    window.location.href = `/OneProduct.html?id=${p.id}`;
                }
            };

            const imgSrc = p.imagefile
                ? `${API_BASE}/products/${p.id}/image`
                : "https://placehold.co/300x200?text=No+Image";

            const categoryName = getCategoryName(p);
            const unit = getUnit(p);
            const unitLabel = unit ? ` ${unit}` : "";

            card.innerHTML = `
                <div class="img-container">
                    <img src="${imgSrc}" alt="${p.name}" onerror="this.src='https://placehold.co/300x200?text=No+Image'">
                    ${categoryName ? `<span class="category-tag">${categoryName}</span>` : ""}
                </div>
                <div class="content">
                    <h3>${p.name}</h3>
                    <span class="unit-note">${p.quantity ?? ""}${unitLabel} available</span>
                    <div class="price-row">
                        <span class="price">₹${p.price}</span>
                        <button class="add-btn" onclick="addToCart(event, ${p.id})">Add to cart</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ---------- Pagination UI ----------
    function renderPagination(pageData) {
        const el = document.getElementById("pagination");
        el.innerHTML = "";

        totalPages = pageData.totalPages;
        if (totalPages <= 1) return;

        const makeBtn = (label, targetPage, opts = {}) => {
            const btn = document.createElement("button");
            btn.innerText = label;
            if (opts.active) btn.classList.add("active");
            if (opts.disabled) btn.disabled = true;
            btn.onclick = () => {
                if (!opts.disabled && targetPage !== currentPage) {
                    loadProducts(targetPage, currentSearchTerm, activeCategory);
                    window.scrollTo({ top: 0, behavior: "smooth" });
                }
            };
            return btn;
        };

        el.appendChild(makeBtn("‹", currentPage - 1, { disabled: pageData.first }));

        const range = pageRange(currentPage, totalPages);
        range.forEach(item => {
            if (item === "...") {
                const span = document.createElement("span");
                span.className = "page-info";
                span.innerText = "…";
                el.appendChild(span);
            } else {
                el.appendChild(makeBtn(String(item + 1), item, { active: item === currentPage }));
            }
        });

        el.appendChild(makeBtn("›", currentPage + 1, { disabled: pageData.last }));

        const info = document.createElement("span");
        info.className = "page-info";
        info.innerText = `Page ${currentPage + 1} of ${totalPages}`;
        el.appendChild(info);
    }

    function pageRange(current, total) {
        const delta = 2;
        const range = [];
        for (let i = 0; i < total; i++) {
            if (i === 0 || i === total - 1 || (i >= current - delta && i <= current + delta)) {
                range.push(i);
            } else if (range[range.length - 1] !== "...") {
                range.push("...");
            }
        }
        return range;
    }

    // ---------- Filtering ----------
    function filterProducts() {
        loadProducts(0, document.getElementById("searchInput").value.trim(), activeCategory);
    }

    // ---------- Category arrows ----------
    function scrollCats(dir) {
        const row = document.getElementById("categoryRow");
        row.scrollBy({ left: dir * 260, behavior: "smooth" });
    }

    function updateArrows() {
        const row   = document.getElementById("categoryRow");
        const left  = document.querySelector(".scroll-btn.left");
        const right = document.querySelector(".scroll-btn.right");
        if (!left || !right) return;

        const atStart  = row.scrollLeft <= 4;
        const atEnd    = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
        const noScroll = row.scrollWidth <= row.clientWidth + 4;

        if (noScroll) {
            left.style.opacity  = "0";
            right.style.opacity = "0";
            left.style.pointerEvents  = "none";
            right.style.pointerEvents = "none";
            return;
        }

        left.style.opacity  = atStart ? "0" : "1";
        right.style.opacity = atEnd   ? "0" : "1";
        left.style.pointerEvents  = atStart ? "none" : "auto";
        right.style.pointerEvents = atEnd   ? "none" : "auto";
    }

    // ---------- Cart ----------
    function addToCart(event, productId) {
        event.stopPropagation();
        event.preventDefault();

        const btn = event.currentTarget;
        if (!btn || btn.classList.contains("loading") || btn.classList.contains("added")) return;

        spawnRipple(btn, event);
        btn.classList.add("loading");

        fetch(`${API_BASE}/users/cart/items`, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"        // <-- forces JSON 401 from entry point
            },
            body: JSON.stringify({ productId: productId, quantity: 1 })
        })
            .then(res => {
                if (isUnauthorized(res)) {
                    const err = new Error("UNAUTHORIZED");
                    err.code = "UNAUTHORIZED";
                    throw err;
                }
                if (!res.ok) throw new Error("Add to cart failed");
                return res.json();
            })
            .then(() => {
                btn.classList.remove("loading");
                btn.classList.add("added");
                const originalText = btn.innerText;
                btn.innerText = "✓ Added";

                const card = btn.closest(".card");
                if (card) {
                    card.classList.add("pulse");
                    setTimeout(() => card.classList.remove("pulse"), 700);
                }

                refreshCartBadge(true);

                setTimeout(() => {
                    btn.classList.remove("added");
                    btn.innerText = originalText || "Add to cart";
                }, 1400);
            })
            .catch(err => {
                console.error("Add to cart error:", err);
                btn.classList.remove("loading");

                if (err.code === "UNAUTHORIZED") {
                    // Guest → show our styled modal, not the raw login page
                    btn.innerText = "Add to cart";
                    openAuthModal();
                    return;
                }

                btn.innerText = "Try again";
                setTimeout(() => { btn.innerText = "Add to cart"; }, 1200);
            });
    }

    // Ripple: places a circle where the user clicked inside the button
    function spawnRipple(btn, event) {
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        const size = Math.max(rect.width, rect.height) * 2;
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
        ripple.style.top  = `${event.clientY - rect.top  - size / 2}px`;
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }

    function refreshCartBadge(animate = false) {
        fetch(`${API_BASE}/users/cart`, {
            credentials: "include",
            headers: { "Accept": "application/json" }
        })
            .then(res => {
                if (isUnauthorized(res)) {
                isGuestUser = true;
                return null;
            }
            if (!res.ok) return null;
            isGuestUser = false;
            return res.json();
            })
            .then(cart => {
                if (!cart) return;
                const badge = document.getElementById("cartBadge");
                const count = (cart.items || []).reduce((sum, item) => sum + (item.quantity || 0), 0);

                const changed = badge.innerText !== String(count);
                badge.innerText = count;
                badge.dataset.empty = count === 0 ? "true" : "false";

                if (animate && changed && count > 0) {
                    badge.classList.remove("pop");
                    void badge.offsetWidth;
                    badge.classList.add("pop");
                    setTimeout(() => badge.classList.remove("pop"), 500);
                }
            })
            .catch(() => {});
    }

    // ---------- Logout ----------
    function logout() {
        fetch("/auth/v1/logout", { method: "POST" })
            .catch(err => console.error("Logout error:", err))
            .finally(() => { window.location.href = "/LoginForm.html"; });
    }

    // ============================================================
    //  DRAG-TO-SCROLL + CLICK-TO-FILTER FOR CATEGORY ROW
    // ============================================================
    (function setupCategoryDragAndClick() {
        const row = document.getElementById("categoryRow");

        let isPointerDown = false;
        let isDragging = false;
        let startX = 0;
        let startScrollLeft = 0;
        let pointerId = null;
        let draggedChip = null;
        let suppressNextClick = false;

        function onPointerDown(e) {
            if (e.pointerType === "mouse" && e.button !== 0) return;
            isPointerDown = true;
            isDragging = false;
            startX = e.clientX;
            startScrollLeft = row.scrollLeft;
            pointerId = e.pointerId;
            draggedChip = e.target.closest(".chip");
            try { row.setPointerCapture(pointerId); } catch (_) {}
        }

        function onPointerMove(e) {
            if (!isPointerDown) return;
            const dx = e.clientX - startX;

            if (!isDragging && Math.abs(dx) > DRAG_THRESHOLD) {
                isDragging = true;
                row.classList.add("dragging");
                row.style.cursor = "grabbing";
            }

            if (isDragging) {
                row.scrollLeft = startScrollLeft - dx;
                e.preventDefault();
            }
        }

        function onPointerUp(e) {
            if (!isPointerDown) return;

            const wasDragging = isDragging;
            const chip = draggedChip;

            isPointerDown = false;
            isDragging = false;
            draggedChip = null;
            row.classList.remove("dragging");
            row.style.cursor = "";

            try { row.releasePointerCapture(pointerId); } catch (_) {}
            pointerId = null;

            if (wasDragging) {
                suppressNextClick = true;
                setTimeout(() => { suppressNextClick = false; }, 0);
            } else if (chip) {
                const cat = chip.dataset.category;
                if (cat && cat !== activeCategory) {
                    activeCategory = cat;
                    row.querySelectorAll(".chip").forEach(c => {
                        c.classList.toggle("active", c.dataset.category === cat);
                    });
                    loadProducts(0, currentSearchTerm, cat);
                }
            }
        }

        row.addEventListener("click", (e) => {
            if (suppressNextClick) {
                e.preventDefault();
                e.stopPropagation();
                suppressNextClick = false;
            }
        }, true);

        row.addEventListener("pointerdown", onPointerDown);
        row.addEventListener("pointermove", onPointerMove);
        row.addEventListener("pointerup", onPointerUp);
        row.addEventListener("pointercancel", onPointerUp);
        row.addEventListener("dragstart", (e) => e.preventDefault());
    })();

    // ---------- Wheel: horizontal scroll ----------
    const categoryRowEl = document.getElementById("categoryRow");
    categoryRowEl.addEventListener("scroll", updateArrows);
    categoryRowEl.addEventListener("wheel", (event) => {
        if (event.deltaY !== 0) {
            event.preventDefault();
            categoryRowEl.scrollLeft += event.deltaY;
        }
    }, { passive: false });

    window.addEventListener("resize", updateArrows);

    // ---------- Initial load ----------
    fetch(`${API_BASE}/products/categories`, { credentials: "include" })
        .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        })
        .then(cats => {
            availableCategories = ["All", ...cats];
            renderCategories();
        })
        .catch(err => {
            console.error("Failed to load categories:", err);
            availableCategories = ["All"];
            renderCategories();
        });

    // Kick off first load → shows skeletons → then real products
    loadProducts(0);
    refreshCartBadge();

    // ---------- bfcache reload ----------
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });

    // ---------- Auth Prompt Modal ----------
    let authModalEl = null;

    function openAuthModal() {
        authModalEl = authModalEl || document.getElementById("authModal");
        if (!authModalEl) return;

        setAuthModalLinks();

        authModalEl.classList.add("show");
        authModalEl.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
    }

    function closeAuthModal() {
        authModalEl = authModalEl || document.getElementById("authModal");
        if (!authModalEl) return;
        authModalEl.classList.remove("show");
        authModalEl.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
    }

    // Close on backdrop click + Escape key
    document.addEventListener("click", (e) => {
        if (e.target && e.target.id === "authModal") closeAuthModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAuthModal();
    });

    // Helper: detect a 401/403 from a fetch response
    function isUnauthorized(res) {
        return res.status === 401 || res.status === 403;
    }

    // Hide logout if not logged in
    (function hideLogoutIfGuest() {
        fetch(`${API_BASE}/users/cart`, {
            credentials: "include",
            headers: { "Accept": "application/json" }
        })
            .then(res => {
                const btn = document.querySelector(".btn-logout");
                if (!btn) return;
                if (res.status === 401 || res.status === 403) {
                    btn.style.display = "none";
                }
            })
            .catch(() => {});
    })();

    // ---------- Navbar Cart: gate for guests ----------
    (function setupCartNavGate() {
        const cartLink = document.getElementById("cartNavLink");
        if (!cartLink) return;

        cartLink.addEventListener("click", (e) => {
            // Let modifier clicks / middle-click / target=_blank behave normally
            if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) return;

            // Fast path: we already know the user is a guest
            if (isGuestUser === true) {
                e.preventDefault();
                openAuthModal();
                return;
            }

            // Fast path: we already know the user is logged in
            if (isGuestUser === false) {
                return;   // let the browser navigate normally
            }

            e.preventDefault();

            // Probe the cart endpoint — if we get 401, user is a guest
            fetch(`${API_BASE}/users/cart`, {
                credentials: "include",
                headers: { "Accept": "application/json" }
            })
                .then(res => {
                    if (isUnauthorized(res)) {
                        openAuthModal();
                        return;
                    }
                    // Logged in (or some other status we can't classify) → just go
                    window.location.href = cartLink.href;
                })
                .catch(() => {
                    // Network error → let the browser try the navigation
                    window.location.href = cartLink.href;
                });
        });
    })();

    // In openAuthModal() — before showing
    function setAuthModalLinks() {
        const here = encodeURIComponent(location.pathname + location.search);
        const loginLink = document.querySelector('#authModal .auth-btn-primary');
        const registerLink = document.querySelector('#authModal .auth-btn-secondary');
        if (loginLink)    loginLink.href    = `/LoginForm.html?redirect=${here}`;
        if (registerLink) registerLink.href = `/RegistrationForm.html?redirect=${here}`;
    }

</script>
</body>
</html>
