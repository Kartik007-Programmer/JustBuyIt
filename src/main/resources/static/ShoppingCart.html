<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — JustBuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-wash: #CCCCFF;
            --surface: #ffffff;
            --ink: #23213a;
            --ink-muted: #6b6a85;
            --brand: #4f46e5;
            --brand-dark: #3730a3;
            --price: #0f9d70;
            --danger-bg: #fee2e2;
            --danger: #ef4444;
            --danger-dark: #991b1b;
            --border: #e7e6f5;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 30px rgba(79, 70, 229, 0.10);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(180deg, var(--bg-wash) 0px, var(--bg-wash) 160px, #f6f6fc 160px, #f6f6fc 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--ink);
            min-height: 100vh;
        }

        a { color: inherit; }

        /* ---------- Header ---------- */
        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 0 0 18px 18px;
        }

        .navbar-brand { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
        .navbar-brand span { color: var(--brand-dark); }

        .nav-links { display: flex; align-items: center; gap: 10px; }

        .nav-link {
            text-decoration: none;
            color: #3d3c5c;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 9px 16px;
            border-radius: 20px;
            transition: background-color 0.15s ease;
        }
        .nav-link:hover { background-color: rgba(255,255,255,0.6); }

        .cart-link { position: relative; display: inline-flex; align-items: center; gap: 6px; }
        .cart-badge {
            background: var(--brand-dark);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .btn-logout {
            background: var(--danger-bg);
            color: var(--danger);
            border: none;
            padding: 9px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-logout:hover { background: #fca5a5; color: var(--danger-dark); }

        /* ---------- Layout ---------- */
        .page-top{
            z-index: 18;
            backdrop-filter: blur(8px);
            max-width: 1200px;
            margin: 30px auto 0 auto;
            padding: 20px 40px 50px 40px;
        }
        main {
            max-width: 1100px;
            margin: 30px auto 80px auto;
            padding: 0 40px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            text-decoration: none;
            color: #4a486a;
            font-weight: 600;
            font-size: 0.92rem;
        }
        .back:hover { color: var(--brand-dark); }

        h1.page-title {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 24px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 26px;
            align-items: start;
        }

        /* ---------- Item list ---------- */
        .item-list {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .cart-item:last-child { border-bottom: none; }

        .item-thumb {
            width: 76px;
            height: 76px;
            border-radius: var(--radius-md);
            background: #f1f0fb;
            overflow: hidden;
            flex-shrink: 0;
        }
        .item-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .item-info { flex: 1; min-width: 0; }
        .item-info h3 {
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-info .unit-price { color: var(--ink-muted); font-size: 0.88rem; margin-top: 3px; }

        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .qty-control button {
            background: #f6f6fc;
            border: none;
            width: 32px;
            height: 34px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--brand-dark);
            cursor: pointer;
        }
        .qty-control button:hover { background: #eceaf9; }
        .qty-control span {
            width: 34px;
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .item-subtotal {
            width: 90px;
            text-align: right;
            font-weight: 800;
            color: var(--price);
            flex-shrink: 0;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--ink-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            padding: 6px;
            transition: color 0.15s ease;
        }
        .remove-btn:hover { color: var(--danger); }

        /* ---------- Summary ---------- */
        .summary-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 26px 26px 22px 26px;
            position: sticky;
            top: 30px;
        }
        .summary-card h2 {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 18px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.92rem;
            color: var(--ink-muted);
            margin-bottom: 10px;
        }
        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 800;
            padding-top: 14px;
            margin-top: 8px;
            border-top: 1px solid var(--border);
        }
        .summary-total .amount { color: var(--price); }

        .btn-checkout {
            width: 100%;
            margin-top: 20px;
            background: #f59e0b;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.98rem;
            transition: background-color 0.15s ease;
        }
        .btn-checkout:hover { background: #d97f06; }
        .btn-checkout:disabled { opacity: 0.5; cursor: not-allowed; }

        .clear-cart-btn {
            width: 100%;
            margin-top: 10px;
            background: none;
            border: 1px solid var(--border);
            color: var(--ink-muted);
            padding: 11px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: 0.15s ease;
        }
        .clear-cart-btn:hover { border-color: var(--danger); color: var(--danger); }

        /* ---------- States ---------- */
        .state-message {
            text-align: center;
            padding: 100px 20px;
            color: var(--ink-muted);
        }
        .state-message h3 { color: var(--ink); font-size: 1.15rem; margin-bottom: 6px; }
        .state-message .browse-link {
            display: inline-block;
            margin-top: 16px;
            color: var(--brand);
            font-weight: 700;
            text-decoration: none;
        }
        .state-message .browse-link:hover { color: var(--brand-dark); }

        .feedback {
            margin-top: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }
        .feedback.error { color: var(--danger); }

        @media (max-width: 780px) {
            .cart-layout { grid-template-columns: 1fr; }
            .summary-card { position: static; }
            .navbar, main { padding-left: 20px; padding-right: 20px; }
            .cart-item { flex-wrap: wrap; }
            .item-subtotal { width: auto; margin-left: auto; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">Just<span>Buy</span>It</div>
    <div class="nav-links">
        <a href="/LoginForm.html" class="nav-link">Login</a>
        <a href="/RegistrationForm.html" class="nav-link">Register</a>
        <a href="/Cart.html" class="nav-link cart-link">Cart <span class="cart-badge" id="cartBadge">0</span></a>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="page-top">
    <a href="HomePage.html" class="back">← Back to products</a>
</div>

<main>
    <h1 class="page-title">Your cart</h1>
    <div id="cartContent">
        <div class="state-message"><h3>Loading your cart…</h3></div>
    </div>
</main>

<script>
    const API_BASE = "http://localhost:8080";
    const CART_BASE = `${API_BASE}/users/cart`;
    let currentCart = null;

    function loadCart() {
        fetch(CART_BASE, { credentials: "include" })
            .then(res => {
                if (res.status === 401 || res.status === 403) throw new Error("Not authenticated");
                if (!res.ok) throw new Error("Failed to load cart");
                return res.json();
            })
            .then(cart => {
                currentCart = cart;
                renderCart(cart);
                updateBadge(cart);
            })
            .catch(err => {
                console.error("Failed to load cart:", err);
                document.getElementById("cartContent").innerHTML = `
                    <div class="state-message">
                        <h3>Couldn't load your cart</h3>
                        <p>Check your connection and try again.</p>
                    </div>`;
            });
    }

    function renderCart(cart) {
        const container = document.getElementById("cartContent");
        const items = cart.items || [];

        if (items.length === 0) {
            container.innerHTML = `
                <div class="state-message">
                    <h3>Your cart is empty</h3>
                    <p>Items you add will show up here.</p>
                    <a href="HomePage.html" class="browse-link">Browse products →</a>
                </div>`;
            return;
        }

        const rows = items.map(item => `
            <div class="cart-item" data-item-id="${item.id}">
                <div class="item-thumb">
                    <img src="${API_BASE}/products/${item.productId}/image"
                         onerror="this.src='https://via.placeholder.com/80?text=No+Image'"
                         alt="${item.productName}">
                </div>
                <div class="item-info">
                    <h3>${item.productName}</h3>
                    <div class="unit-price">₹${item.unitPrice} each</div>
                </div>
                <div class="qty-control">
                    <button type="button" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                    <span>${item.quantity}</span>
                    <button type="button" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                </div>
                <div class="item-subtotal">₹${item.subTotal}</div>
                <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
            </div>
        `).join("");

        container.innerHTML = `
            <div class="cart-layout">
                <div class="item-list">${rows}</div>
                <div class="summary-card">
                    <h2>Order summary</h2>
                    <div class="summary-row">
                        <span>Items (${items.reduce((sum, i) => sum + i.quantity, 0)})</span>
                        <span>₹${cart.totalPrice}</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span class="amount">₹${cart.totalPrice}</span>
                    </div>
                    <button class="btn-checkout" onclick="goToCheckout()">Proceed to checkout</button>
                    <button class="clear-cart-btn" onclick="clearCart()">Clear cart</button>
                    <div class="feedback" id="feedback"></div>
                </div>
            </div>
        `;
    }

    // The controller has no endpoint to update a line item's quantity directly —
    // only POST /users/cart/items (add) and DELETE /users/cart/items/{id} (remove).
    // So a quantity change removes the existing line, then re-adds it at the new
    // quantity, which works regardless of whether addItemToCart merges or replaces.
    function updateQuantity(itemId, newQuantity) {
        const item = (currentCart.items || []).find(i => i.id === itemId);
        if (!item) return;

        if (newQuantity < 1) {
            removeItem(itemId);
            return;
        }

        fetch(`${CART_BASE}/items/${itemId}`, { method: "DELETE", credentials: "include" })
            .then(res => {
                if (!res.ok) throw new Error("Failed to update quantity");
                return fetch(`${CART_BASE}/items`, {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ productId: item.productId, quantity: newQuantity })
                });
            })
            .then(res => {
                if (!res.ok) throw new Error("Failed to update quantity");
                return res.json();
            })
            .then(cart => {
                currentCart = cart;
                renderCart(cart);
                updateBadge(cart);
            })
            .catch(err => {
                console.error("Update quantity error:", err);
                showFeedback("Couldn't update quantity. Try again.");
                loadCart();
            });
    }

    function removeItem(itemId) {
        fetch(`${CART_BASE}/items/${itemId}`, { method: "DELETE", credentials: "include" })
            .then(res => {
                if (!res.ok) throw new Error("Failed to remove item");
                return res.json();
            })
            .then(cart => {
                currentCart = cart;
                renderCart(cart);
                updateBadge(cart);
            })
            .catch(err => {
                console.error("Remove item error:", err);
                showFeedback("Couldn't remove item. Try again.");
            });
    }

    function clearCart() {
        if (!confirm("Remove all items from your cart?")) return;
        fetch(CART_BASE, { method: "DELETE", credentials: "include" })
            .then(res => {
                if (!res.ok) throw new Error("Failed to clear cart");
                loadCart();
            })
            .catch(err => {
                console.error("Clear cart error:", err);
                showFeedback("Couldn't clear cart. Try again.");
            });
    }

    function showFeedback(message) {
        const el = document.getElementById("feedback");
        if (el) {
            el.innerText = message;
            el.className = "feedback error";
        }
    }

    function goToCheckout() {
        window.location.href = "Checkout.html";
    }

    function updateBadge(cart) {
        const count = (cart.items || []).reduce((sum, i) => sum + (i.quantity || 0), 0);
        document.getElementById("cartBadge").innerText = count;
    }

    function logout() {
        try {
            fetch("/auth/v1/logout", { method: "POST" });
        } catch (error) {
            console.error("Logout error:", error);
        } finally {
            window.location.href = "LoginForm.html";
        }
    }

    loadCart();

    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>
</body>
</html>
