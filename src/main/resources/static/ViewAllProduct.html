<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Gallery</title>
    <style>
        body { background: #CCCCFF; font-family: sans-serif; padding: 40px; }

        /* Search Bar Styling */
        .search-container {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
        }
        #searchInput {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: 1rem;
            outline: none;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .img-container { height: 200px; background: #eee; width: 100%; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 20px; }
        .price { color: #10b981; font-weight: bold; font-size: 1.2rem; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 8px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .del { background: #fee2e2; color: #ef4444; }
    </style>
</head>
<body>

<h1 style="text-align:center">Our Inventory</h1>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search products by name..." onkeyup="filterProducts()">
</div>

<div class="grid" id="productList"></div>

<script>
    let allProducts = []; // Local cache to handle filtering efficiently

    function loadProducts() {
        fetch("http://localhost:8080/products")
        .then(res => res.json())
        .then(data => {
            allProducts = data; // Store data for filtering
            displayProducts(allProducts);
        });
    }

    function displayProducts(products) {
        const container = document.getElementById("productList");
        container.innerHTML = "";

        products.forEach(p => {
            const card = document.createElement("div");
            card.className = "card";
            card.onclick = (e) => {
                if(!e.target.closest('button')) window.location.href=`AdminOneProduct.html?id=${p.id}`;
            };

            const imgSrc = p.imagefile ? `http://localhost:8080/products/${p.id}/image` : 'https://via.placeholder.com/300x200?text=No+Image';

            card.innerHTML = `
                <div class="img-container"><img src="${imgSrc}"></div>
                <div class="content">
                    <h3>${p.name}</h3>
                    <p class="price">₹${p.price}</p>
                    <div class="btn-group">
                        <button class="btn del" onclick="deleteProduct(${p.id})">Delete</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Filter Logic
    function filterProducts() {
        const searchTerm = document.getElementById("searchInput").value.toLowerCase();
        if (searchTerm.trim() === "") {
            loadProducts();
            return;
        }

        fetch(`http://localhost:8080/products/search?keyword=${encodeURIComponent(searchTerm)}`)
            .then(res => res.json())
            .then(data => {
                displayProducts(data);
        })
        .catch(err => console.error("Search failed:", err));
<!--        const filtered = allProducts.filter(p =>-->
<!--            p.name.toLowerCase().includes(searchTerm)-->
<!--        );-->
<!--        displayProducts(filtered);-->
    }

    function deleteProduct(id) {
        if(confirm("Delete?")) {
            fetch(`http://localhost:8080/products/${id}`, { method: "DELETE" }).then(() => loadProducts());
        }
    }

    loadProducts();

    window.addEventListener("pageshow", function (event) {
        if(event.persisted){
            window.location.reload();
        }
    });

</script>
</body>
</html>
