<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — JustBuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/users/common.css">
    <link rel="stylesheet" href="/css/users/pages/auth.css">
</head>
<body class="auth-page">

<a href="/" class="auth-brand">Just<span>Buy</span>It</a>

<div class="auth-card">
    <h2>Create your account</h2>
    <p class="sub">It takes less than a minute to get started.</p>

    <form id="registerForm">
        <div class="form-group">
            <label for="name">Full name</label>
            <input type="text" id="name" required placeholder="John Doe" autocomplete="name">
        </div>
        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" required placeholder="user@example.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
            <div class="hint">Use at least 6 characters.</div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
    </form>

    <div class="auth-footer-text">
        Already have an account? <a href="/LoginForm.html">Sign in</a>
    </div>
</div>

<a href="/HomePage.html" class="auth-home-link">← Continue browsing</a>

<div id="globalPopup" class="popup-alert" role="alert" aria-live="polite">
    <div class="popup-icon" id="popupIcon">✓</div>
    <div class="popup-message" id="popupMessage"></div>
    <button class="popup-close" id="popupCloseBtn" aria-label="Close notification">×</button>
    <div class="popup-progress" id="popupProgress"></div>
</div>

<script src="/js/popup.js"></script>
<script>
    function getRedirectTarget() {
        const raw = new URLSearchParams(location.search).get("redirect");
        if (!raw) return null;
        if (!raw.startsWith("/") || raw.startsWith("//") || raw.includes("\\")) return null;
        if (raw.startsWith("/RegistrationForm.html")) return null;
        return raw;
    }
    const REDIRECT_TARGET = getRedirectTarget();

    (function forwardToLoginLink() {
        if (!REDIRECT_TARGET) return;
        const loginLink = document.querySelector('.auth-footer-text a[href="/LoginForm.html"]');
        if (loginLink) {
            loginLink.href = `/LoginForm.html?redirect=${encodeURIComponent(REDIRECT_TARGET)}`;
        }
    })();

    const DEFAULT_ROLE = 'USER';

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: DEFAULT_ROLE
        };

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account…';

        try {
            const response = await fetch('/auth/v1/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showPopup(
                    'Account created! Check your inbox to verify your email before signing in.',
                    'success',
                    5000
                );
                submitBtn.textContent = 'Awaiting verification…';

                const destination = REDIRECT_TARGET
                    ? `/LoginForm.html?redirect=${encodeURIComponent(REDIRECT_TARGET)}`
                    : "/LoginForm.html";
                setTimeout(() => window.location.href = destination, 1800);
            } else {
                const text = await response.text().catch(() => '');
                showPopup(text || 'Registration failed. Please check your details.', 'error', 5000);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create account';
            }
        } catch (error) {
            showPopup('Unable to connect to the server.', 'error', 5000);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create account';
        }
    });

    window.addEventListener("pageshow", e => { if (e.persisted) window.location.reload(); });
</script>

</body>
</html>
