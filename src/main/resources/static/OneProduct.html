<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details — JustBuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/users/pages/product.css">
    <link rel="stylesheet" href="/css/users/common.css">
</head>

<!-- ============ LOGIN PROMPT MODAL ============ -->
<div class="auth-modal-backdrop" id="authModal" aria-hidden="true">
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <button class="auth-modal-close" onclick="closeAuthModal()" aria-label="Close">×</button>

        <div class="auth-modal-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2Zm10-10V7a4 4 0 0 0-8 0v4h8Z"
                      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h2 id="authModalTitle">Sign in to continue</h2>
        <p class="auth-modal-msg">
            You need an account to add items to your cart and check out.
        </p>

        <div class="auth-modal-actions">
            <a href="/LoginForm.html" class="auth-btn auth-btn-primary">Log in</a>
            <a href="/RegistrationForm.html" class="auth-btn auth-btn-secondary">Create account</a>
        </div>

        <button class="auth-modal-later" onclick="closeAuthModal()">
            Continue browsing
        </button>
    </div>
</div>

<body>

<nav class="navbar">
    <div class="navbar-brand">Just<span>Buy</span>It</div>
    <div class="nav-links">
        <a href="/LoginForm.html" class="nav-link">Login</a>
        <a href="/RegistrationForm.html" class="nav-link">Register</a>
        <a href="/users/ShoppingCart.html" class="nav-link cart-link" aria-label="Cart" id="cartNavLink">                <span class="cart-icon-wrap">
                <span class="cart-icon-wrap">
                    <svg class="cart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3 3h2.2l2.1 12.4a2 2 0 0 0 1.97 1.6h9.36a2 2 0 0 0 1.96-1.55L22 8H6.2"
                              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9" cy="20" r="1.6" fill="currentColor"/>
                        <circle cx="18" cy="20" r="1.6" fill="currentColor"/>
                    </svg>
                    <span class="cart-badge" id="cartBadge" data-empty="true">0</span>
                </span>
            <span class="cart-text">Cart</span>
        </a>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="page-top">
    <a href="/HomePage.html" class="back">← Back to products</a>
</div>

<main id="mainContent">
    <div class="state-message"><h3>Loading product…</h3></div>
</main>

<script>
    const API_BASE = "http://localhost:8080";
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    let currentProduct = null;
    let isGuestUser = null;

    // Product API may return the raw Product entity (nested `category: { name }`)
    // or a ProductDTO (`categoryName` string, `qunatityUnit` string). Support both.
    function getCategoryName(p) {
        return p.category?.name || p.categoryName || null;
    }
    function getUnit(p) {
        return p.quantityUnit || p.qunatityUnit || null;
    }

    function renderProduct(p) {
        currentProduct = p;
        const imgSrc = p.imagefile
            ? `${API_BASE}/products/${p.id}/image`
            : "https://placehold.co/500?text=No+Image";

        const categoryName = getCategoryName(p);
        const unit = getUnit(p);
        const unitLabel = unit ? ` ${unit}` : "";
        const inStock = (p.quantity ?? 0) > 0;
        const lowStock = inStock && p.quantity <= 5;

        document.getElementById("mainContent").innerHTML = `
            <div class="detail-card">
                <div class="image-side">
                    <img src="${imgSrc}" alt="${p.name}">
                    ${categoryName ? `<span class="category-tag">${categoryName}</span>` : ""}
                </div>
                <div class="info-side">
                    <h1>${p.name}</h1>
                    <p class="desc">${p.description || "No description available for this product."}</p>

                    <div class="price-row">
                        <span class="price">₹${p.price}</span>
                        ${unit ? `<span class="unit-note">per ${unit}</span>` : ""}
                    </div>

                    <p class="stock-line ${lowStock ? "low" : ""}">
                        ${inStock
                            ? `<b>${p.quantity}${unitLabel}</b> in stock${lowStock ? " — order soon" : ""}`
                            : `<b>Out of stock</b>`}
                    </p>

                    <div class="qty-row">
                        <div class="qty-control">
                            <button type="button" onclick="changeQty(-1)">−</button>
                            <input type="number" id="qtyInput" value="1" min="1" max="${p.quantity ?? 1}">
                            <button type="button" onclick="changeQty(1)">+</button>
                        </div>
                    </div>

                    <div class="action-row">
                        <button class="btn-primary" id="buyBtn" onclick="buyProduct(event)" ${inStock ? "" : "disabled"}>Buy now</button>
                        <button class="btn-secondary" id="cartBtn" onclick="addToCart(event)" ${inStock ? "" : "disabled"}>Add to cart</button>
                    </div>

                    <div class="feedback" id="feedback"></div>
                </div>
            </div>
        `;
    }

    function loadProduct() {
        if (!id) {
            document.getElementById("mainContent").innerHTML = `
                <div class="state-message"><h3>No product selected</h3><p>Go back and pick a product to view.</p></div>
            `;
            return;
        }

        fetch(`${API_BASE}/products/${id}`)
            .then(res => {
                if (!res.ok) throw new Error("Product not found");
                return res.json();
            })
            .then(p => renderProduct(p))
            .catch(err => {
                console.error("Failed to load product:", err);
                document.getElementById("mainContent").innerHTML = `
                    <div class="state-message"><h3>Couldn't load this product</h3><p>It may have been removed, or the connection failed.</p></div>
                `;
            });
    }

    function changeQty(delta) {
        const input = document.getElementById("qtyInput");
        const max = currentProduct?.quantity ?? 1;
        let value = parseInt(input.value || "1", 10) + delta;
        value = Math.max(1, Math.min(value, max));
        input.value = value;
    }

    function getQty() {
        const input = document.getElementById("qtyInput");
        return input ? Math.max(1, parseInt(input.value || "1", 10)) : 1;
    }

    function showFeedback(message, type) {
        const el = document.getElementById("feedback");
        if (!el) return;
        el.innerText = message;
        el.className = `feedback ${type}`;
    }

    function addToCart(event) {
        const btn = document.getElementById("cartBtn");
        if (!btn || btn.classList.contains("loading") || btn.classList.contains("added")) return;

        if (event) spawnRipple(btn, event);
        btn.classList.add("loading");

        const qty = getQty();
        fetch(`${API_BASE}/users/cart/items`, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ productId: currentProduct.id, quantity: qty })
        })
            .then(res => {
                if (isUnauthorized(res)) {
                    const e = new Error("UNAUTHORIZED");
                    e.code = "UNAUTHORIZED";
                    throw e;
                }
                if (!res.ok) throw new Error("Add to cart failed");
                return res.json();
            })
            .then(() => {
                btn.classList.remove("loading");
                btn.classList.add("added");
                const original = btn.innerText;
                btn.innerText = "✓ Added to cart";
                showFeedback("Added to cart.", "success");
                refreshCartBadge(true);
                setTimeout(() => {
                    btn.classList.remove("added");
                    btn.innerText = original || "Add to cart";
                }, 1400);
            })
            .catch(err => {
                console.error("Add to cart error:", err);
                btn.classList.remove("loading");

                if (err.code === "UNAUTHORIZED") {
                    btn.innerText = "Add to cart";
                    openAuthModal();
                    return;
                }

                btn.innerText = "Try again";
                showFeedback("Couldn't add to cart. Try again.", "error");
                setTimeout(() => { btn.innerText = "Add to cart"; }, 1200);
            });
    }

    // Buy now — same loading treatment, then redirect
    function buyProduct(event) {
        const btn = document.getElementById("buyBtn");
        if (!btn || btn.classList.contains("loading")) return;

        if (event) spawnRipple(btn, event);
        btn.classList.add("loading");

        const qty = getQty();
        fetch(`${API_BASE}/users/cart/items`, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({ productId: currentProduct.id, quantity: qty })
        })
            .then(res => {
                if (isUnauthorized(res)) {
                    const e = new Error("UNAUTHORIZED");
                    e.code = "UNAUTHORIZED";
                    throw e;
                }
                if (!res.ok) throw new Error("Couldn't add to cart");
                return res.json();
            })
            .then(() => {
                refreshCartBadge(true);
                setTimeout(() => {
                    window.location.href = "/users/PaymentCheckout.html";
                }, 350);
            })
            .catch(err => {
                console.error("Buy now error:", err);
                btn.classList.remove("loading");

                if (err.code === "UNAUTHORIZED") {
                    openAuthModal();
                    return;
                }
                showFeedback("Couldn't start checkout. Try again.", "error");
            });
    }

    function spawnRipple(btn, event) {
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        const size = Math.max(rect.width, rect.height) * 2;
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
        ripple.style.top  = `${event.clientY - rect.top  - size / 2}px`;
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }

    function refreshCartBadge(animate = false) {
        fetch(`${API_BASE}/users/cart`, {
            credentials: "include",
            headers: { "Accept": "application/json" }
        })
            .then(res => {
                if (isUnauthorized(res)) {
                isGuestUser = true;
                return null;
            }
            if (!res.ok) return null;
            isGuestUser = false;
            return res.json();
            })
            .then(cart => {
                if (!cart) return;
                const badge = document.getElementById("cartBadge");
                const count = (cart.items || []).reduce((sum, item) => sum + (item.quantity || 0), 0);
                const changed = badge.innerText !== String(count);
                badge.innerText = count;
                badge.dataset.empty = count === 0 ? "true" : "false";
                if (animate && changed && count > 0) {
                    badge.classList.remove("pop");
                    void badge.offsetWidth;
                    badge.classList.add("pop");
                    setTimeout(() => badge.classList.remove("pop"), 500);
                }
            })
            .catch(() => {});
    }

    function logout() {
        try {
            fetch("/auth/v1/logout", { method: "POST" });
        } catch (error) {
            console.error("Logout error:", error);
        } finally {
            window.location.href = "/LoginForm.html";
        }
    }

    loadProduct();
    refreshCartBadge();

    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });

    // ---------- Auth Prompt Modal ----------
    let authModalEl = null;

    function openAuthModal() {
        authModalEl = authModalEl || document.getElementById("authModal");
        if (!authModalEl) return;

        setAuthModalLinks();

        authModalEl.classList.add("show");
        authModalEl.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
    }

    function closeAuthModal() {
        authModalEl = authModalEl || document.getElementById("authModal");
        if (!authModalEl) return;
        authModalEl.classList.remove("show");
        authModalEl.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
    }

    // Close on backdrop click + Escape key
    document.addEventListener("click", (e) => {
        if (e.target && e.target.id === "authModal") closeAuthModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAuthModal();
    });

    // Helper: detect a 401/403 from a fetch response
    function isUnauthorized(res) {
        return res.status === 401 || res.status === 403;
    }

    // Hide logout if not logged in
    (function hideLogoutIfGuest() {
        fetch(`${API_BASE}/users/cart`, {
            credentials: "include",
            headers: { "Accept": "application/json" }
        })
            .then(res => {
                const btn = document.querySelector(".btn-logout");
                if (!btn) return;
                if (res.status === 401 || res.status === 403) {
                    btn.style.display = "none";
                }
            })
            .catch(() => {});
    })();

    // ---------- Navbar Cart: gate for guests ----------
    (function setupCartNavGate() {
        const cartLink = document.getElementById("cartNavLink");
        if (!cartLink) return;

        cartLink.addEventListener("click", (e) => {
            // Let modifier clicks / middle-click / target=_blank behave normally
            if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) return;

            // Fast path: we already know the user is a guest
            if (isGuestUser === true) {
                e.preventDefault();
                openAuthModal();
                return;
            }

            // Fast path: we already know the user is logged in
            if (isGuestUser === false) {
                return;   // let the browser navigate normally
            }

            e.preventDefault();

            // Probe the cart endpoint — if we get 401, user is a guest
            fetch(`${API_BASE}/users/cart`, {
                credentials: "include",
                headers: { "Accept": "application/json" }
            })
                .then(res => {
                    if (isUnauthorized(res)) {
                        openAuthModal();
                        return;
                    }
                    // Logged in (or some other status we can't classify) → just go
                    window.location.href = cartLink.href;
                })
                .catch(() => {
                    // Network error → let the browser try the navigation
                    window.location.href = cartLink.href;
                });
        });
    })();

    // In openAuthModal() — before showing
    function setAuthModalLinks() {
        const here = encodeURIComponent(location.pathname + location.search);
        const loginLink = document.querySelector('#authModal .auth-btn-primary');
        const registerLink = document.querySelector('#authModal .auth-btn-secondary');
        if (loginLink)    loginLink.href    = `/LoginForm.html?redirect=${here}`;
        if (registerLink) registerLink.href = `/RegistrationForm.html?redirect=${here}`;
    }
</script>
</body>
</html>
