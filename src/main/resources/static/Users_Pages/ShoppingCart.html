<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — JustBuyIt</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/Icons/Favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/users/pages/cart.css">
    <link rel="stylesheet" href="/css/users/common.css">
</head>

<body>

<!-- ============ LOGIN PROMPT MODAL ============ -->
<div class="auth-modal-backdrop" id="authModal" aria-hidden="true">
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <button class="auth-modal-close" onclick="closeAuthModal()" aria-label="Close">×</button>

        <div class="auth-modal-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2Zm10-10V7a4 4 0 0 0-8 0v4h8Z"
                      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h2 id="authModalTitle">Sign in to continue</h2>
        <p class="auth-modal-msg">
            You need an account to add items to your cart and check out.
        </p>

        <div class="auth-modal-actions">
            <a href="/LoginForm.html" class="auth-btn auth-btn-primary">Log in</a>
            <a href="/RegistrationForm.html" class="auth-btn auth-btn-secondary">Create account</a>
        </div>

        <button class="auth-modal-later" onclick="closeAuthModal()">
            Continue browsing
        </button>
    </div>
</div>

<!-- ============ HEADER ============ -->
<header>
    <nav class="navbar">
        <div class="navbar-brand">Just<span>Buy</span>It</div>

        <div class="nav-links">
            <a href="/LoginForm.html"        class="nav-link guest-only">Login</a>
            <a href="/RegistrationForm.html" class="nav-link guest-only">Register</a>

            <a href="/Users_Pages/ShoppingCart.html"
               class="nav-link cart-link"
               id="cartNavLink"
               aria-label="Cart">
                <span class="cart-icon-wrap">
                    <svg class="cart-icon" viewBox="0 0 24 24" fill="none"
                         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3 3h2.2l2.1 12.4a2 2 0 0 0 1.97 1.6h9.36a2 2 0 0 0 1.96-1.55L22 8H6.2"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9"  cy="20" r="1.6" fill="currentColor"/>
                        <circle cx="18" cy="20" r="1.6" fill="currentColor"/>
                    </svg>
                    <span class="cart-badge" id="cartBadge" data-empty="true">0</span>
                </span>
                <span class="cart-text">Cart</span>
            </a>
        </div>

        <div class="user-menu auth-only" id="userMenu" hidden>
            <button class="user-pill" id="userPill"
                    aria-haspopup="true" aria-expanded="false"
                    aria-controls="userDropdown">
                <span class="user-avatar" id="userAvatar">U</span>
                <span class="user-name"   id="userName">User</span>
                <svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                    <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2"
                          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <div class="user-dropdown" id="userDropdown" role="menu">
                <a href="/Users_Pages/Profile.html" role="menuitem">My Profile</a>
                <a href="/Users_Pages/Orders.html"  role="menuitem">My Orders</a>
                <hr>
                <button class="danger" onclick="logout()" role="menuitem">Logout</button>
            </div>
        </div>
    </nav>
</header>

<div class="page-top">
    <a href="/HomePage.html" class="back">← Back to products</a>
</div>

<main>
    <h1 class="page-title">Your cart</h1>
    <div id="cartContent">
        <div class="state-message"><h3>Loading your cart…</h3></div>
    </div>
</main>

<script src="/js/users/navbar.js"></script>
<script>
    /* ============================================================
       PAGE STATE
       ============================================================ */
    const API_BASE = (() => {
        // Local development
        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            return "http://localhost:8080";
        }
        // Production — same origin
        return window.location.origin;
    })();
    const CART_BASE = `${API_BASE}/users/cart`;
    let currentCart = null;

    /* ============================================================
       LOAD CART
       ============================================================ */
    function loadCart() {
        fetch(CART_BASE, { credentials: "include" })
            .then(res => {
                if (res.status === 401 || res.status === 403) throw new Error("Not authenticated");
                if (!res.ok) throw new Error("Failed to load cart");
                return res.json();
            })
            .then(cart => {
                currentCart = cart;
                renderCart(cart);
                updateBadge(cart);
            })
            .catch(err => {
                console.error("Failed to load cart:", err);
                document.getElementById("cartContent").innerHTML = `
                    <div class="state-message">
                        <h3>Couldn't load your cart</h3>
                        <p>Check your connection and try again.</p>
                    </div>`;
            });
    }

    /* ============================================================
       RENDER CART
       ============================================================ */
    function renderCart(cart) {
        const container = document.getElementById("cartContent");
        const items = cart.items || [];

        if (items.length === 0) {
            container.innerHTML = `
                <div class="state-message">
                    <h3>Your cart is empty</h3>
                    <p>Items you add will show up here.</p>
                    <a href="/HomePage.html" class="browse-link">Browse products →</a>
                </div>`;
            return;
        }

        const rows = items.map(item => `
            <div class="cart-item" data-item-id="${item.id}">
                <div class="item-thumb">
                    <img src="${API_BASE}/products/${item.productId}/image"
                         onerror="this.src='https://via.placeholder.com/80?text=No+Image'"
                         alt="${item.productName}">
                </div>
                <div class="item-info">
                    <h3>${item.productName}</h3>
                    <div class="unit-price">₹${item.unitPrice} each</div>
                </div>
                <div class="qty-control">
                    <button type="button" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                    <span>${item.quantity}</span>
                    <button type="button" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                </div>
                <div class="item-subtotal">₹${item.subTotal}</div>
                <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
            </div>
        `).join("");

        container.innerHTML = `
            <div class="cart-layout">
                <div class="item-list">${rows}</div>
                <div class="summary-card">
                    <h2>Order summary</h2>
                    <div class="summary-row">
                        <span>Items (${items.reduce((sum, i) => sum + i.quantity, 0)})</span>
                        <span>₹${cart.totalPrice}</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span class="amount">₹${cart.totalPrice}</span>
                    </div>
                    <button class="btn-checkout" onclick="goToCheckout()">Proceed to checkout</button>
                    <button class="clear-cart-btn" onclick="clearCart()">Clear cart</button>
                    <div class="feedback" id="feedback"></div>
                </div>
            </div>
        `;
    }

    /* ============================================================
       UPDATE QUANTITY (delete + re-add since there's no PATCH endpoint)
       ============================================================ */
    function updateQuantity(itemId, newQuantity) {
        const item = (currentCart.items || []).find(i => i.id === itemId);
        if (!item) return;

        if (newQuantity < 1) {
            removeItem(itemId);
            return;
        }

        fetch(`${CART_BASE}/items/${itemId}`, { method: "DELETE", credentials: "include" })
            .then(res => {
                if (!res.ok) throw new Error("Failed to update quantity");
                return fetch(`${CART_BASE}/items`, {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ productId: item.productId, quantity: newQuantity })
                });
            })
            .then(res => {
                if (!res.ok) throw new Error("Failed to update quantity");
                return res.json();
            })
            .then(cart => {
                currentCart = cart;
                renderCart(cart);
                updateBadge(cart);
            })
            .catch(err => {
                console.error("Update quantity error:", err);
                showFeedback("Couldn't update quantity. Try again.");
                loadCart();
            });
    }

    /* ============================================================
       REMOVE ITEM
       ============================================================ */
    function removeItem(itemId) {
        fetch(`${CART_BASE}/items/${itemId}`, { method: "DELETE", credentials: "include" })
            .then(res => {
                if (!res.ok) throw new Error("Failed to remove item");
                return res.json();
            })
            .then(cart => {
                currentCart = cart;
                renderCart(cart);
                updateBadge(cart);
            })
            .catch(err => {
                console.error("Remove item error:", err);
                showFeedback("Couldn't remove item. Try again.");
            });
    }

    /* ============================================================
       CLEAR CART
       ============================================================ */
    function clearCart() {
        if (!confirm("Remove all items from your cart?")) return;
        fetch(CART_BASE, { method: "DELETE", credentials: "include" })
            .then(res => {
                if (!res.ok) throw new Error("Failed to clear cart");
                loadCart();
            })
            .catch(err => {
                console.error("Clear cart error:", err);
                showFeedback("Couldn't clear cart. Try again.");
            });
    }

    /* ============================================================
       FEEDBACK + NAVIGATION
       ============================================================ */
    function showFeedback(message) {
        const el = document.getElementById("feedback");
        if (el) {
            el.innerText = message;
            el.className = "feedback error";
        }
    }

    function goToCheckout() {
        window.location.href = "/Users_Pages/PaymentCheckout.html";
    }

    function updateBadge(cart) {
        const badge = document.getElementById("cartBadge");
        if (!badge) return;
        const count = (cart.items || []).reduce((sum, i) => sum + (i.quantity || 0), 0);
        badge.innerText = count;
        badge.dataset.empty = count === 0 ? "true" : "false";
    }

    /* ============================================================
       INIT — wait for auth, redirect guests, then load cart
       ============================================================ */
    (async function initPage() {
        const user = await window.__authReady;
        if (window.isGuestUser) {
            const here = encodeURIComponent(location.pathname + location.search);
            window.location.href = `/LoginForm.html?redirect=${here}`;
            return;
        }
        loadCart();
    })();
</script>
</body>
</html>
