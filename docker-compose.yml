services:
  redis:
    image: redis:alpine
    container_name: justbuyitapp-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=
      - REDIS_MAXMEMORY=256mb
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  redis-data:
