<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — JustBuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/users/common.css">
    <link rel="stylesheet" href="/css/users/pages/auth.css">
</head>
<body class="auth-page">

<a href="/" class="auth-brand">Just<span>Buy</span>It</a>

<div class="auth-card">
    <h2>Set a new password</h2>
    <p class="sub">Choose a strong password to secure your account.</p>

    <form id="resetForm">
        <div class="form-group">
            <label for="password">New password</label>
            <input type="password" id="password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
            <div class="hint">Use at least 6 characters.</div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Reset password</button>
    </form>

    <div class="auth-footer-text">
        <a href="/LoginForm.html">Back to sign in</a>
    </div>
</div>

<a href="/HomePage.html" class="auth-home-link">← Continue browsing</a>

<div id="globalPopup" class="popup-alert" role="alert" aria-live="polite">
    <div class="popup-icon" id="popupIcon">✓</div>
    <div class="popup-message" id="popupMessage"></div>
    <button class="popup-close" id="popupCloseBtn" aria-label="Close notification">×</button>
    <div class="popup-progress" id="popupProgress"></div>
</div>

<script src="/js/popup.js"></script>
<script>
    const TOKEN = new URLSearchParams(location.search).get('token');

    if (!TOKEN) {
        showPopup('Missing or invalid reset token.', 'error', 6000);
        document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const body = new URLSearchParams();
        body.append('token', TOKEN);
        body.append('password', document.getElementById('password').value);

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating…';

        try {
            const res = await fetch('/auth/v1/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body
            });
            const msg = await res.text();

            if (res.ok) {
                showPopup(msg || 'Password updated! Redirecting to sign in…', 'success', 4000);
                submitBtn.textContent = 'Redirecting…';
                setTimeout(() => window.location.href = '/LoginForm.html', 1600);
            } else {
                showPopup(msg || 'Reset failed. Please try again.', 'error', 5000);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset password';
            }
        } catch (err) {
            showPopup('Unable to connect to the server.', 'error', 5000);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset password';
        }
    });
</script>

</body>
</html>
